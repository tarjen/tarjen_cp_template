name: Test template directories
on:
  push:
    paths:
      - src/**
      - src-acm/**
      - tests/**
      - tools/build_acm_sources.py
      - .github/workflows/tests.yml
  pull_request:
    paths:
      - src/**
      - src-acm/**
      - tests/**
      - tools/build_acm_sources.py
      - .github/workflows/tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [run_template_refactor.py, run_acm_variants.py]
    steps:
      - uses: actions/checkout@v7
      - name: Check hand-copy source generation
        if: matrix.runner == 'run_acm_variants.py'
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/build_acm_sources.py
          git diff --exit-code -- src-acm ACM源码改动清单.md
          test -z "$(git ls-files --others --exclude-standard -- src-acm)"
      - name: Run regression tests with sanitizers
        run: python3 tests/${{ matrix.runner }} --sanitize
