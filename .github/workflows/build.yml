name: Build Typst document
on:
  push:
    paths:
      - "*.typ"
      - src/**
      - .github/workflows/build.yml
      - logo.png
      - BW.tmtheme
  pull_request:
    paths:
      - "*.typ"
      - src/**
      - .github/workflows/build.yml
      - logo.png
      - BW.tmtheme
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-liberation
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"
      - name: Build PDF
        run: typst compile main.typ main.pdf
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: template-pdf
          path: main.pdf
          if-no-files-found: error

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: template-pdf
      - uses: softprops/action-gh-release@v2
        with:
          files: main.pdf
